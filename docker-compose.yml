services:
  app:
    build: .
    container_name: mindcare.bu.ac.th_app
    ports:
      - "8024:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      BASE_URL: ${BASE_URL:-http://localhost:8024}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_HOSTNAME: ${TURNSTILE_HOSTNAME:-}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set in .env}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-}
    volumes:
      - ./data:/app/data
      - ./public/uploads:/app/public/uploads
      - ./backups:/app/backups
      - ./logs:/app/logs
